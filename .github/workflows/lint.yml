name: "Lint"

on:
  workflow_call:
    inputs:
      ubuntu-version:
        description: "Ubuntu runner version"
        required: false
        default: "ubuntu-24.04"
        type: string

jobs:

  flake8:
    runs-on: ${{ inputs.ubuntu-version }}

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: pip install flake8
      - run: flake8

  black:
    runs-on: ${{ inputs.ubuntu-version }}

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: pip install "black>=23,<24"
      - run: black --check .

  mypy:
    runs-on: ${{ inputs.ubuntu-version }}

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: pip install -r dev-requirements.txt
      - run: mypy .
